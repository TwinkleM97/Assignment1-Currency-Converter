name: Currency-Converter-CI/CD-Pipeline_Twinkle_8894858

on:
  pull_request:
    branches:
      - Twinkle-8894858

defaults:
  run:
    shell: bash
    working-directory: .

env:
  DOCKER_IMAGE_NAME: currency-converter-app
  DOCKER_TAG: ${{ github.sha }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install pytest

      - name: Run tests
        run: python test_currency_converter.py

  docker-build-and-run:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t $DOCKER_IMAGE_NAME:$DOCKER_TAG .
          docker images

      - name: Run container
        run: |
          docker run --name test-container -d $DOCKER_IMAGE_NAME:$DOCKER_TAG
          sleep 5
          docker logs test-container

      - name: Stop and remove container
        if: always()
        run: |
          docker stop test-container || true
          docker rm test-container || true
